{% extends "base.html" %}

{% block title %}Quiz - CodeKO{% endblock %}

{% block extra_styles %}
    <style>
        .quiz-container {
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 2rem;
            margin: 2rem auto;
            max-width: 1200px;
        }

        .question-panel {
            background: white;
            border-radius: 8px;
            padding: 2rem;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }

        .progress-sidebar {
            background: white;
            border-radius: 8px;
            padding: 1.5rem;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            height: fit-content;
            position: sticky;
            top: 1rem;
        }

        .progress-title {
            font-weight: bold;
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        .question-counter {
            text-align: center;
            font-size: 2rem;
            font-weight: bold;
            color: var(--primary);
            margin-bottom: 1rem;
        }

        .timer {
            text-align: center;
            font-size: 1.5rem;
            color: #FF6B6B;
            font-weight: bold;
            margin-bottom: 1rem;
        }

        .progress-bar-container {
            background: var(--light);
            height: 8px;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .progress-bar {
            background: linear-gradient(90deg, var(--secondary), var(--primary));
            height: 100%;
            transition: width 0.3s;
        }

        .question-statement {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        .code-snippet {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 1.5rem;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.95rem;
            margin: 1.5rem 0;
            overflow-x: auto;
            border-left: 4px solid var(--primary);
        }

        .options-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin: 1.5rem 0;
        }

        .option {
            background: var(--light);
            border: 2px solid transparent;
            padding: 1rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
        }

        .option:hover {
            border-color: var(--secondary);
            background: #f0f0f0;
        }

        .option input[type="radio"] {
            margin-right: 1rem;
            cursor: pointer;
        }

        .option.selected {
            background: var(--secondary);
            color: white;
            border-color: var(--secondary);
        }

        .option.correct {
            background: #4CAF50;
            color: white;
            border-color: #4CAF50;
        }

        .option.incorrect {
            background: #FF6B6B;
            color: white;
            border-color: #FF6B6B;
        }

        .input-answer {
            width: 100%;
            padding: 1rem;
            border: 2px solid var(--border);
            border-radius: 4px;
            font-size: 1rem;
            margin: 1rem 0;
        }

        .input-answer:focus {
            outline: none;
            border-color: var(--primary);
        }

        .button-group {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
            justify-content: space-between;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .btn-submit {
            background: var(--primary);
            color: white;
            flex: 1;
            font-weight: bold;
        }

        .btn-submit:hover:not(:disabled) {
            background: #ff5252;
            transform: scale(1.02);
        }

        .btn-submit:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .btn-skip {
            background: var(--light);
            color: var(--text);
        }

        .explanation {
            background: var(--light);
            padding: 1.5rem;
            border-radius: 4px;
            margin-top: 1.5rem;
            border-left: 4px solid var(--secondary);
            display: none;
        }

        .explanation.show {
            display: block;
        }

        .explanation-title {
            font-weight: bold;
            margin-bottom: 0.5rem;
            color: var(--secondary);
        }

        @media (max-width: 768px) {
            .quiz-container {
                grid-template-columns: 1fr;
            }

            .progress-sidebar {
                position: static;
            }
        }
    </style>
{% endblock %}

{% block content %}
    <div class="quiz-container">
        <div class="question-panel">
            <div class="question-statement" id="questionStatement">
                Carregando questão...
            </div>

            <div id="codeSnippet" class="code-snippet" style="display: none;"></div>

            <form id="quizForm" style="display: none;">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div id="optionsContainer" class="options-container"></div>
                <input type="text" id="textAnswer" class="input-answer" placeholder="Digite sua resposta..." style="display: none;">

                <div class="explanation" id="explanation">
                    <div class="explanation-title">Explicação:</div>
                    <div id="explanationText"></div>
                </div>

                <div class="button-group">
                    <button type="button" class="btn btn-skip" id="skipBtn">Pular</button>
                    <button type="submit" class="btn btn-submit" id="submitBtn">Responder</button>
                </div>
            </form>
        </div>

        <div class="progress-sidebar">
            <div class="progress-title">Progresso</div>
            <div class="question-counter" id="questionCounter">1/10</div>
            <div class="timer" id="timer">00:00</div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar" style="width: 10%;"></div>
            </div>
            <div style="background: var(--light); padding: 1rem; border-radius: 4px; text-align: center;">
                <p style="color: #666; font-size: 0.9rem;">Respostas Corretas</p>
                <p style="font-size: 1.5rem; font-weight: bold; color: var(--secondary);" id="correctCount">0</p>
            </div>
        </div>
    </div>

    <script>
        let currentQuestion = 0;
        let questions = [];
        let answers = {};
        let moduleId = {{ module_id }};
        let quizFinished = false;
        let questionAnswered = false;

        // Cronômetro de TEMPO GASTO (conta para cima, sem pressão de tempo limite)
        let elapsedSeconds = 0;
        let timerInterval = setInterval(() => {
            elapsedSeconds++;
            const minutes = String(Math.floor(elapsedSeconds / 60)).padStart(2, '0');
            const seconds = String(elapsedSeconds % 60).padStart(2, '0');
            document.getElementById('timer').textContent = `${minutes}:${seconds}`;
        }, 1000);

        async function loadQuestions() {
            const response = await fetch(`/api/questions?module_id=${moduleId}&limit=10`);
            questions = await response.json();
            displayQuestion();
        }

        function displayQuestion() {
            if (quizFinished) return;

            const q = questions[currentQuestion];
            document.getElementById('questionStatement').textContent = q.statement;
            document.getElementById('questionCounter').textContent = `${currentQuestion + 1}/${questions.length}`;
            document.getElementById('progressBar').style.width = `${((currentQuestion + 1) / questions.length * 100)}%`;

            const snippetDiv = document.getElementById('codeSnippet');
            if (q.code_snippet) {
                snippetDiv.textContent = q.code_snippet;
                snippetDiv.style.display = 'block';
            } else {
                snippetDiv.style.display = 'none';
            }

            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = '';

            const options = q.options;

            if (q.type === 'multiple_choice' || q.type === 'true_false') {
                document.getElementById('textAnswer').style.display = 'none';
                options.forEach((option, idx) => {
                    const label = document.createElement('label');
                    label.className = 'option';
                    label.innerHTML = `
                        <input type="radio" name="answer" value="${option}">
                        <span>${option}</span>
                    `;
                    optionsContainer.appendChild(label);
                });
                // Habilita o botão somente quando uma alternativa for selecionada
                optionsContainer.querySelectorAll('input[name="answer"]').forEach(input => {
                    input.addEventListener('change', () => {
                        document.getElementById('submitBtn').disabled = false;
                    });
                });
            } else if (q.type === 'code_gap') {
                document.getElementById('textAnswer').style.display = 'block';
                document.getElementById('textAnswer').value = '';
                document.getElementById('textAnswer').focus();
                // Habilita o botão somente quando houver texto digitado
                document.getElementById('textAnswer').addEventListener('input', (e) => {
                    document.getElementById('submitBtn').disabled = e.target.value.trim() === '';
                });
            }

            document.getElementById('explanation').classList.remove('show');
            document.getElementById('quizForm').style.display = 'block';
            document.getElementById('submitBtn').textContent = 'Responder';
            document.getElementById('submitBtn').disabled = true;
            questionAnswered = false;
        }

        async function submitQuiz() {
            const correctCount = Object.values(answers).filter(a => a.correct).length;
            const csrfToken = document.querySelector('input[name="csrf_token"]').value;

            const response = await fetch('/api/progress/submit', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken
                },
                body: JSON.stringify({
                    module_id: moduleId,
                    correct: correctCount,
                    total: questions.length
                })
            });

            const result = await response.json();

            if (!response.ok) {
                alert(result.error || 'Erro ao submeter');
                return;
            }

            // Mostrar resultado
            const resultHTML = `
                <div style="text-align: center; padding: 2rem;">
                    <h1 style="font-size: 2.5rem; margin-bottom: 1rem;">
                        ${result.result === 'knockout' ? '[NOCAUTE]' : result.result === 'win' ? '[VITORIA]' : '[DERROTA]'}
                    </h1>
                    <p style="font-size: 1.2rem; margin-bottom: 1.5rem;">
                        ${correctCount} de ${questions.length} respostas corretas
                    </p>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin: 2rem 0;">
                        <div style="background: #FFE66D; padding: 1.5rem; border-radius: 8px;">
                            <p style="color: #666; font-size: 0.9rem;">XP Ganho</p>
                            <p style="font-size: 2rem; font-weight: bold; color: var(--primary);">+${result.xp_gained}</p>
                            ${result.combo_bonus > 0 ? `<p style="font-size: 0.9rem; color: #FF6B6B;">+${result.combo_bonus} bonus combo!</p>` : ''}
                        </div>
                        <div style="background: var(--secondary); color: white; padding: 1.5rem; border-radius: 8px;">
                            <p style="font-size: 0.9rem;">Seu XP Total</p>
                            <p style="font-size: 2rem; font-weight: bold;">${result.total_xp}</p>
                            <p style="font-size: 0.9rem;">Posicao: #${result.ranking_position}</p>
                        </div>
                    </div>
                    <div style="background: var(--light); padding: 1.5rem; border-radius: 8px; margin: 2rem 0;">
                        <p style="font-size: 1.1rem; font-weight: bold; margin-bottom: 0.5rem;">
                            Combo: ${result.streak} dias
                        </p>
                        <p style="color: #666;">Continue respondendo todos os dias para manter seu combo!</p>
                    </div>
                    <a href="${'{{ url_for("main.home") }}'}" class="btn btn-primary" style="margin-top: 1.5rem;">Voltar ao Dashboard</a>
                </div>
            `;

            document.querySelector('.question-panel').innerHTML = resultHTML;
        }

        document.getElementById('quizForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            // Se o quiz já foi finalizado, submeter resultados
            if (quizFinished) {
                document.getElementById('submitBtn').disabled = true;
                clearInterval(timerInterval);
                await submitQuiz();
                return;
            }

            // Trava contra duplo-clique/duplo-submit, que causava o bug de pular questão
            if (questionAnswered) return;

            const q = questions[currentQuestion];
            let answer;

            if (q.type === 'code_gap') {
                answer = document.getElementById('textAnswer').value.trim();
            } else {
                answer = document.querySelector('input[name="answer"]:checked')?.value;
            }

            if (!answer) {
                alert('Selecione uma resposta!');
                return;
            }

            questionAnswered = true;
            document.getElementById('submitBtn').disabled = true;

            const isCorrect = answer === q.correct_answer;
            answers[q.id] = { answer, correct: isCorrect };

            // Destaque visual nas alternativas (verde = correta, vermelho = errada escolhida)
            if (q.type === 'multiple_choice' || q.type === 'true_false') {
                document.querySelectorAll('.option').forEach(label => {
                    const input = label.querySelector('input[name="answer"]');
                    input.disabled = true;
                    if (input.value === q.correct_answer) {
                        label.classList.add('correct');
                    } else if (input.checked && !isCorrect) {
                        label.classList.add('incorrect');
                    }
                });
            } else if (q.type === 'code_gap') {
                document.getElementById('textAnswer').disabled = true;
                document.getElementById('textAnswer').style.borderColor = isCorrect ? '#4CAF50' : '#FF6B6B';
            }

            const correctCount = Object.values(answers).filter(a => a.correct).length;
            document.getElementById('correctCount').textContent = correctCount;

            document.getElementById('explanation').classList.add('show');
            document.getElementById('explanationText').textContent = q.explanation;

            if (currentQuestion < questions.length - 1) {
                document.getElementById('submitBtn').textContent = 'Próxima';
                setTimeout(() => {
                    currentQuestion++;
                    displayQuestion();
                }, 2000);
            } else {
                quizFinished = true;
                document.getElementById('submitBtn').textContent = 'Finalizar e Enviar';
                document.getElementById('submitBtn').disabled = false;
                document.getElementById('skipBtn').style.display = 'none';
            }
        });

        document.getElementById('skipBtn').addEventListener('click', () => {
            if (questionAnswered) return;
            if (currentQuestion < questions.length - 1) {
                questionAnswered = true;
                answers[questions[currentQuestion].id] = { answer: null, correct: false };
                currentQuestion++;
                displayQuestion();
            }
        });

        loadQuestions();
    </script>
{% endblock %}
